<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background and Gold Gradients -->
    <radialGradient id="honeyGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFA000" />
    </radialGradient>
    
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211D" />
      <stop offset="50%" stop-color="#181614" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <linearGradient id="wingGradientLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.6" />
    </linearGradient>
    
    <linearGradient id="wingGradientRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.6" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Badge Outer Circle/Background -->
  <rect width="500" height="500" rx="250" fill="url(#darkBg)" filter="url(#subtleShadow)" />
  <circle cx="250" cy="250" r="238" fill="none" stroke="url(#goldEdge)" stroke-width="3.5" stroke-dasharray="6,4" opacity="0.6" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldEdge)" stroke-width="2" opacity="0.85" />

  <!-- Honeycomb Hexagon Motif -->
  <!-- Points: Top(250,55), Top-Right(405,145), Bottom-Right(405,325), Bottom(250,415), Bottom-Left(95,325), Top-Left(95,145) -->
  <polygon points="250,68 395,152 395,320 250,404 105,320 105,152" 
           fill="url(#honeyGlow)" 
           stroke="url(#goldEdge)" 
           stroke-width="5" 
           stroke-linejoin="round"
           filter="url(#subtleShadow)" />

  <!-- Inner Hexagon Border Line -->
  <polygon points="250,78 385,157 385,314 250,394 115,314 115,157" 
           fill="none" 
           stroke="#785900" 
           stroke-width="1.8" 
           stroke-opacity="0.4"
           stroke-linejoin="round" />

  <!-- TOP TEXT: COSECHA AÑO -->
  <text x="250" y="118" 
        font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="4.5" 
        fill="#241E15" 
        text-anchor="middle">
    COSECHA 2026
  </text>

  <!-- BEE ICON -->
  <g transform="translate(250, 168) scale(0.9)">
    <!-- Antennae -->
    <path d="M -4,-28 C -7,-36 -14,-38 -17,-35 C -19,-33 -16,-30 -14,-31 C -10,-32 -7,-27 -4,-24" fill="#241E15" />
    <path d="M 4,-28 C 7,-36 14,-38 17,-35 C 19,-33 16,-30 14,-31 C 10,-32 7,-27 4,-24" fill="#241E15" />

    <!-- Left Upper Wing -->
    <path d="M -7,-14 C -22,-36 -54,-40 -64,-24 C -72,-10 -56,12 -12,0 Z" 
          fill="url(#wingGradientLeft)" 
          stroke="#5D4037" 
          stroke-width="1.6" 
          opacity="0.95" />
    <!-- Left Wing Veins -->
    <path d="M -12,0 C -32,-12 -48,-16 -56,-20 M -38,-14 C -48,-5 -52,2 -44,6" 
          fill="none" 
          stroke="#8D6E63" 
          stroke-width="1" 
          opacity="0.6" />

    <!-- Right Upper Wing -->
    <path d="M 7,-14 C 22,-36 54,-40 64,-24 C 72,-10 56,12 12,0 Z" 
          fill="url(#wingGradientRight)" 
          stroke="#5D4037" 
          stroke-width="1.6" 
          opacity="0.95" />
    <!-- Right Wing Veins -->
    <path d="M 12,0 C 32,-12 48,-16 56,-20 M 38,-14 C 48,-5 52,2 44,6" 
          fill="none" 
          stroke="#8D6E63" 
          stroke-width="1" 
          opacity="0.6" />

    <!-- Left Lower Mini-Wing -->
    <path d="M -6,-2 C -18,-10 -38,-4 -40,8 C -42,18 -28,20 -7,8 Z" 
          fill="url(#wingGradientLeft)" 
          stroke="#5D4037" 
          stroke-width="1.2" 
          opacity="0.85" />
    <!-- Right Lower Mini-Wing -->
    <path d="M 6,-2 C 18,-10 38,-4 40,8 C 42,18 28,20 7,8 Z" 
          fill="url(#wingGradientRight)" 
          stroke="#5D4037" 
          stroke-width="1.2" 
          opacity="0.85" />

    <!-- Bee Legs -->
    <path d="M -9,-6 C -18,-6 -24,0 -22,6" fill="none" stroke="#241E15" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 9,-6 C 18,-6 24,0 22,6" fill="none" stroke="#241E15" stroke-width="1.8" stroke-linecap="round" />
    <path d="M -8,6 C -18,10 -22,18 -20,24" fill="none" stroke="#241E15" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 8,6 C 18,10 22,18 20,24" fill="none" stroke="#241E15" stroke-width="1.8" stroke-linecap="round" />

    <!-- Bee Head -->
    <ellipse cx="0" cy="-22" rx="7.5" ry="6" fill="#241E15" />
    <circle cx="-4" cy="-23" r="1.8" fill="#FFD54F" />
    <circle cx="4" cy="-23" r="1.8" fill="#FFD54F" />

    <!-- Bee Thorax -->
    <ellipse cx="0" cy="-11" rx="10.5" ry="8" fill="#241E15" />
    <ellipse cx="0" cy="-11" rx="7" ry="5.5" fill="#543807" />

    <!-- Bee Abdomen with Stripes -->
    <path d="M -11,-2 C -14,12 -12,24 0,36 C 12,24 14,12 11,-2 Z" fill="#241E15" />
    <!-- Yellow Stripes on Abdomen -->
    <path d="M -10,4 C -6,6 6,6 10,4 C 11,8 10,10 9,11 C 5,13 -5,13 -9,11 Z" fill="#FFC107" />
    <path d="M -8,15 C -4,17 4,17 8,15 C 8,19 6,21 5,22 C 3,23 -3,23 -5,22 Z" fill="#FFC107" />
    <circle cx="0" cy="28" r="1.8" fill="#FFD54F" />
    <!-- Stinger -->
    <path d="M -1.5,35 L 0,40 L 1.5,35 Z" fill="#241E15" />
  </g>

  <!-- MAIN TITLE: MIEL -->
  <text x="250" y="248" 
        font-family="'Quicksand', 'Be Vietnam Pro', 'Trebuchet MS', sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="12" 
        fill="#1C1813" 
        text-anchor="middle">
    MIEL
  </text>

  <!-- BANNER: DOÑA CAROLINA -->
  <g transform="translate(0, 260)">
    <!-- Banner Dark Bar -->
    <rect x="75" y="0" width="350" height="42" fill="#181512" rx="4" filter="url(#subtleShadow)" />
    <rect x="75" y="0" width="350" height="42" fill="none" stroke="url(#goldEdge)" stroke-width="1.5" rx="4" />

    <!-- Geometric Folk Triangles Left Pattern (Hourglass / Windmill) -->
    <g transform="translate(86, 7)">
      <!-- Box with triangles -->
      <rect x="0" y="0" width="28" height="28" fill="#26211C" stroke="#E5A800" stroke-width="1" />
      <polygon points="0,0 14,14 0,28" fill="#FFC107" />
      <polygon points="28,0 14,14 28,28" fill="#FFC107" />
      <polygon points="0,0 28,0 14,14" fill="#26211C" />
      <polygon points="0,28 28,28 14,14" fill="#26211C" />
      <circle cx="14" cy="14" r="2.2" fill="#FFE082" />
    </g>

    <!-- Center Brand Text -->
    <text x="250" y="27" 
          font-family="'Quicksand', 'Be Vietnam Pro', 'Georgia', serif" 
          font-size="20" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#FFD54F" 
          text-anchor="middle">
      DOÑA CAROLINA
    </text>

    <!-- Geometric Folk Triangles Right Pattern -->
    <g transform="translate(386, 7)">
      <rect x="0" y="0" width="28" height="28" fill="#26211C" stroke="#E5A800" stroke-width="1" />
      <polygon points="0,0 14,14 0,28" fill="#FFC107" />
      <polygon points="28,0 14,14 28,28" fill="#FFC107" />
      <polygon points="0,0 28,0 14,14" fill="#26211C" />
      <polygon points="0,28 28,28 14,14" fill="#26211C" />
      <circle cx="14" cy="14" r="2.2" fill="#FFE082" />
    </g>
  </g>

  <!-- SUBTITLE: PURA DE ABEJAS -->
  <text x="250" y="340" 
        font-family="'Be Vietnam Pro', 'Montserrat', sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#261E14" 
        text-anchor="middle">
    PURA DE ABEJAS
  </text>

  <!-- WEIGHT / ARTISANAL BADGE -->
  <g transform="translate(250, 368)">
    <rect x="-55" y="-12" width="110" height="22" rx="11" fill="#1C1813" opacity="0.9" />
    <text x="0" y="3.5" 
          font-family="'Be Vietnam Pro', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="2.5" 
          fill="#FFD54F" 
          text-anchor="middle">
      100% ARTESANAL
    </text>
  </g>

  <!-- BOTTOM ARC / LOCATION ACCENT -->
  <text x="250" y="445" 
        font-family="'Be Vietnam Pro', sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="3.5" 
        fill="#FFE082" 
        opacity="0.85"
        text-anchor="middle">
    GOBERNADOR CRESPO • SANTA FE
  </text>
</svg>
